<div class="d-flex justify-content-center m-2">
    <div class="container_login">
        <div class="principal-titulo">Integridade Industrial</div>
        <div class="page-title">Criar Conta</div>
        <div class="subtitulo">Acesse a maior frota industrial do mercado.</div>

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
            </div>
            <a type="submit" class="btn-submit-login text-decoration-none" href="{{url_for('base2')}}">Cadastrar</a>

        </form>

        <div class="divider">
            <span>OU ENTRE COM</span>
        </div>

        <div class="footer-text">
            Já tem uma conta? <a href="#">Fazer Login</a>
        </div>
    </div>
</div>
