{% extends 'home.html' %}


{% block menu_pagina %}

<a href="#" class="text-decoration-none">
    <button class="btn btn-primary-custom">
        <span class="material-symbols-outlined">construction</span>
        Cadastro Máquinas
    </button>
</a>

<a href="#" class="text-decoration-none">
    <button class="btn btn-primary-custom">
        <span class="material-symbols-outlined">swap_horiz</span>
        Movimentações
    </button>
</a>

<a href="#" class="text-decoration-none">
    <button class="btn btn-primary-custom">
        <span class="material-symbols-outlined">emoji_events</span>
        Hanking
    </button>
</a>

{% endblock menu_pagina %}

{% block login_pagina %}
{% endblock login_pagina %}

{% block content%}


<style>
    .cards {
        background: #f3f3f3;
        min-height: calc(100vh - 80px);
        padding: 40px 5%;
    }

    .texto-base {
        margin-bottom: 35px;
    }

    .texto-base h1 {
        color: #222;
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 8px;
    }

    .texto-base p {
        color: #777;
        font-size: 16px;
        margin: 0;
    }

    .highlight {
        background: linear-gradient(135deg, #222, #3d3d3d);
        border-radius: 18px;
        padding: 40px;
        color: white;
        margin-bottom: 35px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        width: 100%;
    }

    .highlight h2 {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 10px;
    }

    .highlight p {
        color: #d0d0d0;
        margin-bottom: 20px;
    }

    .highlight-button {
        background: #efdd8d;
        color: #222;
        border: none;
        padding: 11px 22px;
        border-radius: 10px;
        font-weight: 700;
        text-decoration: none;
        display: inline-block;
    }


    .form-groupp {
        text-align: left;
        margin-bottom: 14px;
    }

    .form-groupp label {
        display: block;
        font-size: 12px;
        font-weight: bold;
        color:#efdd8d;
        margin-bottom: 6px;
    }

    .form-groupp input {
        width: 75%;
        padding: 14px 16px;
        border: 1px solid #dcdcdc;
        border-radius: 4px;
        font-size: 14px;
        color: #efdd8d;
        background-color: #f9fbfb;
        outline: none;
        transition: border-color 0.2s;
    }

    /* Definido uma altura física para evitar conflitos com o Flexbox */
    .carousel-item img {
        border-radius: 18px;
        object-fit: cover;
        width: 100%;
        height: 430px;
    }

</style>
<div class="cards">

    <div class="texto-base">
        <h1>Cadastro de Máquinas</h1>
        <p>Faça já o cadastro de sua máquina.</p>
    </div>

    <div class="row">

        <div class="col-12 col-md-6 mb-4">
            <div class="highlight">
                <h2>Equipamentos para grandes operações</h2>

                <form method="POST" action="/cadastro_maquinas">
                    <div class="form-groupp">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                    </div>

                    <div class="form-groupp">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>

                    <div class="form-groupp">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                    </div>
                </form>

                <a href="#" class="highlight-button mt-3">
                    Cadastrar máquina
                </a>
            </div>
        </div>

        <div class="col-12 col-md-6 mb-4">
            <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel" data-bs-ride="carousel" data-interval="3000" data-bs-interval="3000">
                <div class="carousel-indicators">
                    <button type="button" data-target="#carouselExampleIndicators" data-bs-target="#carouselExampleIndicators" data-slide-to="0" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-target="#carouselExampleIndicators" data-bs-target="#carouselExampleIndicators" data-slide-to="1" data-bs-slide-to="1" class="active2" aria-label="Slide 2"></button>
                    <button type="button" data-target="#carouselExampleIndicators" data-bs-target="#carouselExampleIndicators" data-slide-to="2" data-bs-slide-to="2" class="active3" aria-label="Slide 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="/static/img/mavi.jpg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item ">
                        <img src="/static/img/maquina4.jpg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item ">
                        <img src="/static/img/maquina2.jpg" class="d-block w-100" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-target="#carouselExampleIndicators" data-bs-target="#carouselExampleIndicators" data-slide="prev" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-target="#carouselExampleIndicators" data-bs-target="#carouselExampleIndicators" data-slide="next" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

    </div>

</div>


{% endblock content %}
