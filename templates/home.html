
<!DOCTYPE html>
<html lang="pt-br" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Frontend</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet">



    <style>
        :root {
        /* Updated Palette for Deep Dark Violet Theme */
        --primary: #efdd8d; /* Updated to Light Gold */
        --on-primary: #161f00;
        --primary-container: #4d5b24;
        --on-primary-container: #e8fab2;
        --secondary: #d8c779;
        --secondary-container: #524603;
        --on-secondary-container: #f5e392;

        /* Main Background Change */
        --surface: #fbf9f1;
        --on-surface: #fbf9f1; /* High contrast off-white */
        --on-surface-variant: #c6c8b8;
        --outline: #76786b;
        --outline-variant: #e60db3;

        /* Elevated Surfaces */
        --surface-container: #ffa200;
        --surface-container-high: #f29e0d
;
        --surface-container-highest: #47294a;

        --border-radius-xl: 0.75rem;
        --border-radius-lg: 0.5rem;
        --font-family: 'Inter', sans-serif;
    }

    .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

    .form-group label {
        display: block;
        font-size: 12px;
        font-weight: bold;
        color: #333333;
        margin-bottom: 6px;
    }

    .form-group input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #dcdcdc;
        border-radius: 4px;
        font-size: 14px;
        color: #333333;
        background-color: #f9fbfb;
        outline: none;
        transition: border-color 0.2s;
    }

    .form-group input::placeholder {
        color: #aaaaaa;
    }

    .form-group input:focus {
        border-color: #ff8800;
    }

    body {
        font-family: var(--font-family);
        background-color: var(--surface);
        color: var(--on-surface);
        overflow-x: hidden;
    }

    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
    }

    /* Custom EcoLogistics Styles */
    .btn-primary-custom {
        background-color: var(--primary);
        color: var(--on-primary);
        border: none;
        border-radius: 9999px;
        padding: 0.5rem 1.5rem;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .btn-primary-custom:hover {
        opacity: 0.9;
        color: var(--on-primary);
    }

    .btn-hero-primary {
        background-color: var(--primary);
        color: var(--on-primary);
        border: none;
        border-radius: var(--border-radius-xl);
        padding: 1rem 2rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
    }

    .btn-hero-primary:hover {
        opacity: 0.9;
        color: var(--on-primary);
        transform: scale(0.98);
    }

    .btn-hero-outline {
        background-color: transparent;
        color: var(--on-surface);
        border: 1px solid var(--primary);
        border-radius: var(--border-radius-xl);
        padding: 1rem 2rem;
        font-weight: 700;
        transition: all 0.2s ease;
    }

    .btn-hero-outline:hover {
        background-color: rgba(239, 221, 141, 0.1);
        color: var(--on-surface);
    }

    .badge-eco {
        background-color: var(--secondary-container);
        color:black;
        border-radius: 9999px;
        padding: 0.25rem 1rem;
        font-size: 0.875rem;
        font-weight: 600;
        display: inline-block;
    }

    .text-primary-custom {
        color: black;
    }

    .text-on-surface-variant {
        color: var(--on-surface-variant);
    }

    .sticky-header {
        position: sticky;
        top: 0;
        z-index: 1020;
        background-color: orange;
        transition: all 0.3s ease;
    }

    .sticky-header.scrolled {
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        background-color: orange;
    }

    .container {
        position: relative;
        border-radius: 2rem;
        overflow: hidden;
        box-shadow: 0 20px 50px -11px rgba(0, 0, 0, 0.5);
        min-height: 390px;
        height: 100%;
        padding: 40px 35px;
        width: 100%;
        text-align: center;
        border: 1px solid #eaeaea;
    }

    .hero-img-overlay {
        position: absolute;
        bottom: 1.5rem;
        left: 1.5rem;
        right: 1.5rem;
        background: orange;
        backdrop-filter: blur(10px);
        padding: 1.5rem;
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .stat-divider {
        width: 1px;
        height: 2.5rem;
        background-color: rgba(198, 200, 184, 0.2);
    }

    footer {
        background-color: var(--surface-container-high);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn-submit:hover {
            background-color: #e07700;
        }
    .btn-submit {
            width: 22%;
            background-color: var(--surface-container-high);
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }


    </style>
</head>
<header class="sticky-header">
    <div class="container-xxl">
        <div class="d-flex justify-content-between align-items-center py-3">
            <div class="d-flex align-items-center gap-2">

                <span class="fs-3 fw-bold text-primary-custom">Integridade Industrial</span>
            </div>
            <div class="text-on-surface-variant  fw-semibold small">
                <a class="d-flex align-items-center text-decoration-none"
                   href="{{url_for('home') }}">
                     <button class="btn btn-primary-custom">Home</button>
                </a>
                <a class="text-on-surface-variant text-decoration-none fw-semibold small"></a></div>
            <div class="d-flex align-items-center">
                <a href="{{url_for('login') }}">
                     <button class="btn btn-primary-custom">Login</button>
                </a>
            </div>
        </div>
    </div>
</header>
<main class="container-xxl py-5">
    <section class="row align-items-center g-5 py-5">
        <div class="col-lg-5 hero-content-order">
            <div class="mb-4">

                <h1 class="display-4 fw-bold mb-3 lh-sm text-white"><span style="color: black;" class="">Encontre a máquina certa para sua obra</span>
                    </h1>
                <p class="lead text-on-surface-variant mb-4">
                    Acesse o maior catálogo de maquinas do mercado atual.
                </p>
            </div>

        </div>
        <!-- Image Column -->
        <div class="col-lg-7 hero-image-order">
            <div class="container">
                <div class="form-group">
                <form method="POST" action="/localizar">
                    <div class="form-group">
                        <label for="nome">Máquina</label>
                        <input type="text" id="nome" name="nome" placeholder="EX: Escavadeira" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Localização</label>
                        <input type="text" id="email" name="email" placeholder="Insira a localização" required>
                    </div>
                                <button type="submit" class="btn-submit">Procurar</button>


                </form>


            </div>
        </div>
        </div>


    </section>
</main>
</html>
